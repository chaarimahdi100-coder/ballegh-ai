<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02C39A" />
      <stop offset="50%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02C39A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#028090" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A896" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Symbol Mark (Left) -->
  <g transform="translate(10, 10)">
    <!-- Signal/Pulse civic radiating waves -->
    <path d="M 52 14 A 34 34 0 0 1 76 50" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 58 6 A 44 44 0 0 1 88 50" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 4" fill="none" opacity="0.65" />

    <!-- Civic Pin Base Body -->
    <path d="M 40 8 C 22.3 8 8 22.3 8 40 C 8 58 35 77 38.5 79.4 C 39.4 80.1 40.6 80.1 41.5 79.4 C 45 77 72 58 72 40 C 72 22.3 57.7 8 40 8 Z" 
          fill="url(#pinGrad)" filter="url(#subtleGlow)"/>

    <!-- Inner Core & Human Verification Checkmark -->
    <circle cx="40" cy="38" r="19" fill="#0B132B" opacity="0.95" />
    
    <!-- Verified Action Checkmark + AI Node -->
    <path d="M 31 38 L 37 44 L 49 32" stroke="#02C39A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="49" cy="32" r="2.5" fill="#5CE1E6" />
  </g>

  <!-- Typography / Brand Name -->
  <!-- "BALLEGH" in Navy -->
  <text x="105" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="1.5" fill="#0B132B">
    BALLEGH
  </text>
  
  <!-- "AI" in Teal Badge -->
  <g transform="translate(305, 27)">
    <rect width="52" height="36" rx="8" fill="#028090" />
    <text x="26" y="25" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      AI
    </text>
  </g>

  <!-- Subtitle Tagline: French & Arabic Tunisian context -->
  <text x="106" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#3A506B" letter-spacing="0.5">
    PLATEFORME CIVIQUE INTELIGENTE  •  تونس
  </text>
</svg>
