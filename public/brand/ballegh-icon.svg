<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02C39A" />
      <stop offset="50%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A896" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0B132B" />
  
  <!-- Civic Radiating Waves -->
  <path d="M 64 24 A 36 36 0 0 1 84 55" stroke="#02C39A" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M 69 16 A 46 46 0 0 1 93 55" stroke="#5CE1E6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 4" fill="none" opacity="0.6" />

  <!-- Pin Shape -->
  <path d="M 50 14 C 32.3 14 18 28.3 18 46 C 18 64 45 83 48.5 85.4 C 49.4 86.1 50.6 86.1 51.5 85.4 C 55 83 82 64 82 46 C 82 28.3 67.7 14 50 14 Z" 
        fill="url(#iconPinGrad)" filter="url(#iconGlow)"/>

  <!-- Inner Dark Disc -->
  <circle cx="50" cy="44" r="19" fill="#0B132B" />
  
  <!-- Action Checkmark & AI Spark -->
  <path d="M 41 44 L 47 50 L 59 38" stroke="#02C39A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="59" cy="38" r="2.5" fill="#5CE1E6" />
</svg>
